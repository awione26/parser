[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uslugi-yandex-parser"
dynamic = ["version"]
description = "Permission-gated parser for public Yandex Services professional profiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "protego>=0.4,<1",
  "PyMySQL[rsa]>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
phone = ["playwright==1.62.0"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
uslugi-parser = "uslugi_parser.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "uslugi_parser.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "mysql: integration tests that require an explicitly configured disposable MySQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
